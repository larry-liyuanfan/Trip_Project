services:
  vllm-qwen3-vl:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    container_name: trip-gpu-qwen3-vl
    restart: "no"
    ipc: host
    ports:
      - "${VLLM_BIND_ADDRESS:-127.0.0.1}:${VLLM_HOST_PORT:-8001}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - "${HF_HOME:-/data/huggingface}:/root/.cache/huggingface"
    command:
      - --model
      - ${MODEL_NAME:-Qwen/Qwen3-VL-2B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-Qwen3-VL-2B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.75}
      - --limit-mm-per-prompt
      - '{"image":${VLLM_LIMIT_IMAGES:-1},"video":0}'
      - --enforce-eager
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    gpus: all
