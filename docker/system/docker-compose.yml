name: trip-qwen3-vl-system

services:
  api:
    build:
      context: ../..
      dockerfile: docker/system/Dockerfile.qwen3
    environment:
      APP_ENV: production
      MODEL_PROVIDER: transformers-peft
      MODEL_FALLBACK_ENABLED: "false"
      ENABLE_BETA_DIALOGUE: "true"
      TRIP_RELEASE_CONFIG: /run/trip/release.json
      TRIP_ADAPTER_DIR: /models/adapter
      HF_HOME: /models/huggingface
      MILVUS_URI: http://standalone:19530
      CLIP_DEVICE: cpu
    volumes:
      - ${TRIP_RELEASE_CONFIG:-../../configs/releases/qwen3_vl_system_v1.json}:/run/trip/release.json:ro
      - ${ADAPTER_HOST_DIR:?set ADAPTER_HOST_DIR}:/models/adapter:ro
      - ${HF_CACHE_HOST_DIR:?set HF_CACHE_HOST_DIR}:/models/huggingface
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    gpus: all
    depends_on:
      retrieval-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  retrieval-init:
    build:
      context: ../..
      dockerfile: docker/system/Dockerfile.qwen3
    command:
      - python3
      - scripts/load_system_retrieval.py
      - --config
      - docker/system/milvus_system.yaml
      - --vectors
      - /release/retrieval/clip_vectors_1000.npz
      - --metadata
      - /release/retrieval/clip_metadata_1000.jsonl
    environment:
      MILVUS_URI: http://standalone:19530
    volumes:
      - ${RETRIEVAL_HOST_DIR:?set RETRIEVAL_HOST_DIR}:/release/retrieval:ro
    depends_on:
      standalone:
        condition: service_healthy
    restart: "no"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >
      etcd --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  standalone:
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd-data:
  minio-data:
  milvus-data:
