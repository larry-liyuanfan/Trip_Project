connection:
  uri: http://localhost:19530
  token_env: MILVUS_TOKEN
  timeout_seconds: 30

collection:
  name: ota_business_image_vector
  vector_dimension: 512
  consistency_level: Strong
  embedding_model: openai/clip-vit-base-patch32

index:
  metric_type: COSINE
  index_type: HNSW
  M: 16
  efConstruction: 128
  ef: 64
  scalar_fields:
    - business_id
    - image_id
    - business_category
    - city
    - star_rating
    - price_range
    - image_type
    - embedding_model

benchmark:
  source_table: data/yelp/processed/image_business_attribute_pairs.parquet
  vectors_path: outputs/system_repair/retrieval/clip_vectors_1000.npz
  metadata_path: outputs/system_repair/retrieval/clip_metadata_1000.jsonl
  output_path: outputs/system_repair/retrieval/milvus_benchmark_1000.json
  vector_count: 1000
  query_count: 100
  top_k: 10
  seed: 20260824
