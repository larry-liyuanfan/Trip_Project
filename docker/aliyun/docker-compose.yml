name: ota-trip-aliyun

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: ota-trip-api
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:?set MODEL_API_BASE_URL in docker/aliyun/.env}
      MODEL_NAME: ${MODEL_NAME:-qwen3.7-plus}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-aliyun-model-studio}
      MODEL_API_KEY_FILE: /run/secrets/dashscope_api_key
      MODEL_FALLBACK_ENABLED: "false"
    secrets:
      - dashscope_api_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

secrets:
  dashscope_api_key:
    file: ${DASHSCOPE_API_KEY_FILE:?set DASHSCOPE_API_KEY_FILE in docker/aliyun/.env}
