name: ota-trip-display

services:
  display-api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: ota-trip-display-api
    ports:
      - "${DISPLAY_BIND_ADDRESS:-127.0.0.1}:${DISPLAY_PORT:-8010}:8000"
    environment:
      MODEL_NAME: "offline-results-only"
      MODEL_PROVIDER: "spartan-artifacts"
      MODEL_FALLBACK_ENABLED: "false"
      PROJECT_STATUS_FILE: /display/status.json
      PROJECT_REPORT_DIR: /display/reports
    volumes:
      - "${DISPLAY_DATA_DIR:?set DISPLAY_DATA_DIR to the versioned display artifact directory}:/display:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
