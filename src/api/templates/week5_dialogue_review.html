<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 5 对话人工验收</title><style>
body{font-family:Inter,"Microsoft YaHei",sans-serif;margin:0;background:#f3f5f7;color:#17202a}header{background:#143642;color:white;padding:18px 24px}main{max-width:1100px;margin:18px auto;background:white;padding:20px;border-radius:10px}pre{white-space:pre-wrap;max-height:520px;overflow:auto;background:#f5f7f8;padding:12px}label{display:block;margin:10px 0}select,input,textarea,button{font:inherit;padding:8px}textarea{width:100%;box-sizing:border-box}button{background:#176b87;color:white;border:0;border-radius:6px;padding:10px 16px}.error{color:#b42318}.ok{color:#126b35}
</style></head><body><header><h2>Week 5 最后100条对话人工验收</h2><p>每条必须由本人阅读完整多轮对话与图片引用后作出决定；系统不会代填 accepted。</p></header><main>
<h3 id="counter">载入中</h3><pre id="dialogue"></pre>
<label>真实复核人 <input id="reviewer" value="Larry Fan" autocomplete="off"></label>
<div id="checks"></div>
<label>最终决定 <select id="decision"><option value="">请选择</option><option value="pass">pass</option><option value="rework">rework</option><option value="reject">reject</option></select></label>
<label>备注 <textarea id="notes" rows="4"></textarea></label><p id="message"></p><button id="save">保存并进入下一条</button>
</main><script>
const names={logic:'逻辑连贯',context:'上下文一致',image_reference:'图片引用有效',business_compliance:'业务合规',ota_tone:'OTA语气'};
const checks=document.getElementById('checks');checks.innerHTML=Object.entries(names).map(([k,v])=>`<label>${v} <select data-check="${k}"><option value="">请选择</option><option value="pass">pass</option><option value="fail">fail</option></select></label>`).join('');
let current=null;const msg=(t,e=false)=>{const x=document.getElementById('message');x.textContent=t;x.className=e?'error':'ok'};
async function load(){const r=await fetch('/api/dialogue/tasks?offset=0'),d=await r.json();current=d.tasks[0]||null;document.getElementById('counter').textContent=current?`剩余 ${d.total} 条 · ${current.dialogue_id}`:'100条已全部完成';document.getElementById('dialogue').textContent=current?JSON.stringify(current,null,2):'';document.getElementById('decision').value='';document.getElementById('notes').value='';document.querySelectorAll('[data-check]').forEach(x=>x.value='');}
document.getElementById('save').onclick=async()=>{if(!current)return;try{const values=[...document.querySelectorAll('[data-check]')];if(values.some(x=>!x.value))throw new Error('请逐项完成五项检查');const decision=document.getElementById('decision').value;if(!decision)throw new Error('请选择最终决定');const body={dialogue_id:current.dialogue_id,decision,reviewer:document.getElementById('reviewer').value.trim(),checks:Object.fromEntries(values.map(x=>[x.dataset.check,x.value])),notes:document.getElementById('notes').value||null};const r=await fetch('/api/dialogue/quality',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.detail||'保存失败');msg('已保存真实人工验收记录');await load()}catch(e){msg(e.message,true)}};load();
</script></body></html>
