scenario: itinerary_planning
schema_name: itinerary_planning_v2.schema.json
task_instruction: >-
  Produce the exact requested number of days, with continuous day_index starting at 1. With no user calendar date, date is null on EVERY day. Use two concrete named-place activities per day unless asked otherwise. Each activity needs proposed HH:MM start/end times and a generic transport mode only. All end times must satisfy the deadline. Include every required place and exclude every forbidden place. Add a standalone city constraint_check first, then every other required check; putting the city only in hard_constraints is INVALID. All checks need real support from the proposed activities, not an assertion. Never use 某地点, 附近某场所, or alternative unnamed places. Do not invent source_evidence; it is always []. Put unverified opening/reservation facts in unknown_fields. Images supply only directly visible style/facts; never copy text preferences into visual style_preferences. If visual style is unclear use []. Only list actually provided required_itinerary_elements. If no numeric budget is given do not create one; any price estimate must be explicitly an estimate, not a quotation. Keep the JSON compact. Repeat neither the schema nor these instructions.
