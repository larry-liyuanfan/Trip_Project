scenario: itinerary_planning
schema_name: itinerary_planning_v2.schema.json
format_skeleton: >-
  {"style_preferences":["<图片可见风格>"],"hard_constraints":["<硬约束>"],"soft_constraints":["<软约束>"],"required_itinerary_elements":["daily_schedule"],"itinerary":[{"day_index":1,"date":null,"summary":"<当日摘要>","activities":[{"start_time":null,"end_time":null,"place_name":null,"activity":"<活动>","transport":null,"source_evidence":["<来源证据>"]}]}],"constraint_check":[{"constraint":"<约束>","constraint_type":"hard","status":"unknown","evidence":null}],"observed_evidence":["<图片直接证据>"],"unknown_fields":[],"confidence":null}
task_instruction: >-
  从参考图片提取旅行风格偏好，从原始文字逐项提取硬约束、软约束和必要行程要素，并生成覆盖请求天数的精简逐日行程。顶层必须按此顺序完整输出：style_preferences、hard_constraints、soft_constraints、required_itinerary_elements、itinerary、constraint_check、observed_evidence、unknown_fields、confidence。style_preferences 最多8项，hard_constraints 最多12项，soft_constraints 最多12项；required_itinerary_elements 最多9项且只能从 daily_schedule、poi、accommodation、meals、transport、duration、budget_check、end_time_check、constraint_check 中选择，禁止重复。以上四项都是字符串数组，数组项绝不能写成对象。每一天恰好输出2个互不重复的 activities，禁止通过重复活动填充内容。上述九个顶层键不得放入 itinerary 的每日对象。itinerary 数组长度必须等于请求天数且最多14天；完成指定天数后立即关闭 itinerary 数组并继续输出 constraint_check、observed_evidence、unknown_fields、confidence，四个键一个都不能省略。每日对象只含 day_index、date、summary、activities；每个 activity 必须且只含 start_time、end_time、place_name、activity、transport、source_evidence。constraint_check 最多24项，每项必须同时包含 constraint、constraint_type、status、evidence，其中 constraint_type 只能是 hard 或 soft，status 只能是 satisfied、violated 或 unknown，evidence 是字符串或 null。observed_evidence 最多10项，unknown_fields 最多20项。所有数组去重，图片不能证明具体地点时 place_name 使用 null。
