dataset_version: week4_demo_dev_v1
split: development

paths:
  images_dir: data/eval/images
  exclusion_manifest: data/eval/week4/demo_dev_v1/exclusion_manifest.jsonl
  external_exclusion_manifests:
    - data/eval/registry/evaluation_exclusion_manifest_v2.jsonl
  sampling_logs_dir: data/eval/week4/demo_dev_v1/logs
  runs_dir: outputs/week4/demo_dev_v1/runs
  scores_dir: outputs/week4/demo_dev_v1/scores
  codings_dir: data/eval/week4/demo_dev_v1/codings
  comparisons_dir: outputs/week4/demo_dev_v1/comparisons
  generated_reports_dir: outputs/week4/demo_dev_v1/reports
  readiness_dir: data/eval/week4/demo_dev_v1/readiness

candidate_sources:
  yelp_business_path: data/yelp/interim/business.parquet
  yelp_photos_path: data/yelp/interim/photos.parquet
  yelp_weak_pairs_path: data/yelp/processed/weak_pairs_denoised.parquet
  yelp_source_license: Yelp Open Dataset Terms of Use
  synthetic_recipe_version: week4_demo_dev_itinerary_v1
  after_sales_synthetic_recipe_version: week4_demo_dev_after_sales_v1

metrics:
  aliases_path: configs/evaluation/metric_aliases_v1.json

runtime:
  model_config_path: configs/model_qwen2_vl.yaml
  inference_config_path: configs/inference_week3_v2.yaml
  live_base_url: http://localhost:8001
  timeout_seconds: 180

scenarios:
  image_product_search:
    manifest_path: data/eval/week4/demo_dev_v1/image_product_search.jsonl
    target_count: 12
    sampling:
      seed: 20260726
      stratum_field: coverage_group
      quotas:
        hotel: 4
        attraction: 4
        restaurant: 4
  after_sales:
    manifest_path: data/eval/week4/demo_dev_v1/after_sales.jsonl
    target_count: 12
    sampling:
      seed: 20260726
      stratum_field: coverage_group
      quotas:
        hygiene_stain: 3
        facility_damage: 3
        attraction_closure: 3
        transport_delay: 3
    required_source_types:
      - public_yelp
      - business_synthetic
  itinerary_planning:
    manifest_path: data/eval/week4/demo_dev_v1/itinerary_planning.jsonl
    target_count: 12
    sampling:
      seed: 20260726
      stratum_field: coverage_group
      quotas:
        paired_reference_and_text: 12
